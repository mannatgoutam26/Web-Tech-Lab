<!DOCTYPE html>
<html>
<head>
  <title>ShopEase - Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- header -->
<div id="header">
  <div id="logo">ShopEase</div>
  <div id="nav">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="index.html#categories">Categories</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
    <a href="cart.html" id="cart">Cart</a>
  </div>
</div>

<!-- content -->
<div id="content">
  <h2>Contact Us</h2>
  <div id="contact-area">
    <form id="contact-form">
      <label>Full Name:</label>
      <input type="text" id="fullname">

      <label>Email Address:</label>
      <input type="text" id="email">

      <label>Phone Number:</label>
      <input type="text" id="phone">

      <label>Subject:</label>
      <input type="text" id="subject">

      <label>Message:</label>
      <textarea id="msg"></textarea>

      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </form>

    <div id="contact-info">
      <h3>Our Details</h3>
      <p>Address: ABC Nagar, Jammu and Kashmir</p>
      <p>Email: support@shopease.com</p>
      <p>Phone: 98765XXXXX</p>
      <p>Timing: Mon - Sat, 9 AM to 6 PM</p>
    </div>
  </div>
</div>

<!-- footer -->
<div id="footer">
  <p>&copy; 2026 ShopEase. All rights reserved.</p>
  <p><a href="#">Facebook</a> | <a href="#">Instagram</a> | <a href="#">X</a></p>
</div>

<script src="script.js"></script>
</body>
</html>
